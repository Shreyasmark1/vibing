<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibing</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            color: #1e293b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { transform: scale(0.97); }

        .game-footer {
            padding: 16px 20px 24px;
            display: flex;
            justify-content: center;
        }

        .dev-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dev-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            line-height: 1;
            margin-bottom: 2px;
            display: block;
        }

        .dev-name {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1;
        }

        .social-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .social-btn:active { transform: scale(0.9); }
        .bg-linkedin { background: #0a66c2; }
        .bg-github { background: #24292e; }
    </style>
</head>
<body>
    <div class="flex-1 flex items-center justify-center px-6 w-full">
    <div class="max-w-md w-full py-12 box-border">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-2xl font-extrabold shadow-lg shadow-emerald-200 mb-3">V</div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Vibing</h1>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-[0.25em] mt-1">Pick a game</p>
        </div>

        <div class="glass-panel p-4 grid gap-4">
            <a href="./shikaku/" class="btn block bg-emerald-500 text-white font-bold p-5 rounded-2xl shadow-xl shadow-emerald-100">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-base font-extrabold">Shikaku</div>
                        <div class="text-[10px] text-emerald-100 font-bold uppercase tracking-wider mt-0.5">Geometry Puzzle</div>
                    </div>
                    <div class="text-xl opacity-80">▢</div>
                </div>
            </a>

            <a href="./housie/" class="btn block bg-slate-800 text-white font-bold p-5 rounded-2xl shadow-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-base font-extrabold">Housie</div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Bingo Ticket Game</div>
                    </div>
                    <div class="text-xl opacity-80">✪</div>
                </div>
            </a>
        </div>
    </div>
    </div>

    <footer class="game-footer">
        <div class="dev-info">
            <div class="flex flex-col mr-2">
                <span class="dev-label">Developed by</span>
                <span class="dev-name">Shreyas</span>
            </div>
            <a href="https://www.linkedin.com/in/shreyasmark1" target="_blank" class="social-btn bg-linkedin" title="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://github.com/shreyasmark1" target="_blank" class="social-btn bg-github" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </footer>
</body>
</html>
